<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">工程施工進度魚骨圖</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }

        /* 自訂滾動條 */
        .horizontal-scroll::-webkit-scrollbar {
            height: 12px;
        }
        .horizontal-scroll::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 6px;
        }
        .horizontal-scroll::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 6px;
            border: 2px solid #0f172a;
        }
        .horizontal-scroll::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* 畫布平滑縮放與高解析度防模糊 */
        canvas {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* 時間與日期選擇器深色調優化 */
        input[type="time"]::-webkit-calendar-picker-indicator,
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

    <!-- 頂部導覽與功能按鈕列 -->
    <header class="bg-slate-900/90 border-b border-slate-800 backdrop-blur-md sticky top-0 z-30 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-amber-500/10 border border-amber-500/30 rounded-xl text-amber-400">
                    <i class="fa-solid fa-fish-fins text-xl"></i>
                </div>
                <div>
                    <h1 id="header-title" class="text-lg md:text-xl font-bold text-slate-100 flex items-center gap-2">
                        工程施工進度魚骨圖
                    </h1>
                    <p class="text-xs text-slate-400">點擊卡片可編輯細節或更換現場照片，系統將自動依「日期 + 時間」進行排序</p>
                </div>
            </div>

            <!-- 操作按鈕組 -->
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="openEditModal(null)" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-plus"></i> 新增時間節點
                </button>
                <button onclick="exportPNG()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg text-xs transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-file-image"></i> 匯出高畫質 PNG
                </button>
                <button onclick="exportPDF()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded-lg text-xs transition flex items-center gap-1.5 shadow">
                    <i class="fa-solid fa-print"></i> 列印 / 匯出 PDF
                </button>
                <button onclick="resetDefaultData()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-rose-900/50 hover:text-rose-300 text-slate-400 rounded-lg text-xs transition flex items-center gap-1 border border-slate-700" title="清空並還原為空白版本">
                    <i class="fa-solid fa-rotate-left"></i> 重置空白版
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區域 -->
    <main class="flex-1 max-w-[1800px] w-full mx-auto p-4 flex flex-col gap-6">

        <!-- 魚骨圖 Canvas 滾動展示區 -->
        <section class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-2xl relative">
            <div class="flex justify-between items-center mb-2 px-2 text-xs text-slate-400">
                <span class="flex items-center gap-2">
                    <i class="fa-solid fa-hand-pointer text-amber-400 animate-pulse"></i>
                    可左右滑動查看時間軸；點擊卡片可放大檢視、更換照片或輸入詳細內容。
                </span>
            </div>

            <!-- 可橫向滾動容器 -->
            <div class="horizontal-scroll overflow-x-auto rounded-xl bg-slate-950/80 border border-slate-800/80 p-2">
                <canvas id="fishboneCanvas" class="cursor-pointer block mx-auto"></canvas>
            </div>
        </section>

        <!-- 下方施工節點管理列表 -->
        <section class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                <h2 class="text-base font-bold text-amber-400 flex items-center gap-2">
                    <i class="fa-solid fa-list-check"></i> 施工時間節點管理清單
                </h2>
                <span id="node-count-badge" class="bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-full border border-slate-700">共 0 個節點</span>
            </div>

            <div id="nodes-management-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <!-- 由 JavaScript 動態生成節點管理卡片 -->
            </div>
        </section>

    </main>

    <!-- 編輯 / 新增節點彈出視窗 (Modal) -->
    <div id="edit-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative animate-fade-in max-h-[90vh] overflow-y-auto">
            <button onclick="closeEditModal()" class="absolute top-4 right-4 bg-slate-800 text-slate-400 hover:text-white rounded-full w-8 h-8 flex items-center justify-center border border-slate-700">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 id="modal-form-title" class="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square"></i> 編輯施工時間節點
            </h3>
            
            <form id="node-form" onsubmit="saveNode(event)" class="space-y-4">
                <input type="hidden" id="edit-id">

                <!-- 日期與時間雙選擇器 -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-amber-400 mb-1"><i class="fa-solid fa-calendar-day mr-1"></i>1. 施作日期</label>
                        <input type="date" id="edit-date" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-amber-400 mb-1"><i class="fa-solid fa-clock mr-1"></i>2. 施作時間</label>
                        <input type="time" id="edit-time" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">3. 施工階段名稱</label>
                        <select id="edit-stage" onchange="onStageChange(this.value)" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                            <option value="">-- 請選擇階段 --</option>
                            <option value="基樁點位放樣及定位">基樁點位放樣及定位</option>
                            <option value="基樁套管鑽掘">基樁套管鑽掘</option>
                            <option value="超⾳波垂直度及深度查驗">超⾳波垂直度及深度查驗</option>
                            <option value="中下籠焊接及查驗">中下籠焊接及查驗</option>
                            <option value="上中籠焊接及查驗">上中籠焊接及查驗</option>
                            <option value="特密管吊裝及灌漿前置作業">特密管吊裝及灌漿前置作業</option>
                            <option value="混凝⼟澆置及取樣">混凝⼟澆置及取樣</option>
                            <option value="夜間加班">夜間加班</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">4. 主題標題</label>
                    <input type="text" id="edit-title" placeholder="例如：1. A25樁位放樣" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">5. 詳細說明敘述</label>
                    <textarea id="edit-desc" rows="3" placeholder="請輸入現場作業狀況或處置細節..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">6. 魚骨顯示位置</label>
                        <select id="edit-position" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                            <option value="top">上方骨節</option>
                            <option value="bottom">下方骨節</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">7. 卡片主題配色</label>
                        <select id="edit-color" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                            <option value="blue">🔵 藍色（開工）</option>
                            <option value="rose">🔴 紅色（收工）</option>
                            <option value="emerald">🟢 綠色（正常作業）</option>
                            <option value="amber">🟡 黃色（維修作業）</option>
                            <option value="indigo">🟣 紫色（組裝作業）</option>
                        </select>
                    </div>
                </div>

                <!-- 照片上傳區 -->
                <div class="border-t border-slate-800 pt-3">
                    <label class="block text-xs font-medium text-amber-400 mb-1">8. 更換/上傳現場相片</label>
                    <input type="file" id="edit-image-file" accept="image/*" onchange="previewUploadImage(event)" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer">
                    
                    <div id="image-preview-container" class="mt-2 hidden">
                        <span class="text-[11px] text-slate-400 block mb-1">相片預覽：</span>
                        <img id="image-preview" src="" class="h-28 rounded-lg border border-slate-700 object-cover">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-medium">取消</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-amber-500 text-slate-950 hover:bg-amber-400 text-xs font-bold shadow">儲存變更</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 點擊照片放大 Lightbox Modal -->
    <div id="image-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-3xl w-full overflow-hidden shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white rounded-full w-9 h-9 flex items-center justify-center z-20 border border-slate-600">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="p-2 bg-slate-950 flex items-center justify-center min-h-[280px] max-h-[62vh] overflow-hidden relative">
                <img id="modal-img" src="" alt="Photo Detail" class="max-h-[60vh] w-auto object-contain rounded-lg">
            </div>
            <div class="p-5">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <div class="flex items-center gap-2">
                        <span id="modal-time" class="text-xs bg-amber-500/20 text-amber-400 font-mono px-2.5 py-0.5 rounded-full border border-amber-500/30"></span>
                        <span id="modal-stage" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-full border border-slate-700"></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 text-xs px-3 py-1 rounded-lg flex items-center gap-1 transition">
                            <i class="fa-solid fa-camera"></i> 更換此照片
                            <input type="file" accept="image/*" class="hidden" onchange="uploadDirectImageFromModal(event)">
                        </label>
                        <button onclick="editFromModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs px-3 py-1 rounded-lg flex items-center gap-1 shadow transition">
                            <i class="fa-solid fa-pen-to-square"></i> 編輯詳細內容
                        </button>
                    </div>
                </div>
                <h3 id="modal-title" class="text-lg font-bold text-white mb-1.5"></h3>
                <p id="modal-desc" class="text-xs text-slate-300 leading-relaxed"></p>
            </div>
        </div>
    </div>

    <!-- 自訂確認/提示視窗 Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl text-center">
            <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl border border-amber-500/30">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h4 id="confirm-modal-title" class="text-base font-bold text-white mb-2">確認操作</h4>
            <p id="confirm-modal-msg" class="text-xs text-slate-300 mb-5 leading-relaxed"></p>
            <div class="flex justify-center gap-3">
                <button id="confirm-btn-cancel" onclick="closeConfirmModal(false)" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-medium">取消</button>
                <button id="confirm-btn-ok" onclick="closeConfirmModal(true)" class="px-4 py-2 rounded-lg bg-amber-500 text-slate-950 hover:bg-amber-400 text-xs font-bold shadow">確定</button>
            </div>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="bg-slate-950 border-t border-slate-800/80 py-3 text-center text-xs text-slate-500">
        施工進度與現場處置魚骨圖編輯器 &copy; 空白編輯版
    </footer>

    <script>
        let currentMachineName = "全套管"; // 預設名稱

        // 解析網址參數 ?unit=3號機
        function getUnitParam() {
            const urlParams = new URLSearchParams(window.location.search);
            let unit = urlParams.get('unit');
            if (unit) {
                unit = decodeURIComponent(unit);
                const match = unit.match(/(\d+)/);
                if (match) {
                    return `#${match[1]}機`;
                }
                return unit;
            }
            return "";
        }

        // 安全無污染 SVG 佔位圖生成器
        function createSvgPlaceholder(title, timeDisplay, colorHex) {
            const displayTitle = (title || '未點擊填寫項目').replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const displayTime = (timeDisplay || '--/-- --:--').replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
                <rect width="600" height="400" fill="#0f172a"/>
                <rect x="10" y="10" width="580" height="380" rx="12" fill="none" stroke="${colorHex}" stroke-width="3" stroke-dasharray="8 8" opacity="0.4"/>
                <circle cx="300" cy="170" r="45" fill="${colorHex}" opacity="0.15"/>
                <path d="M300 145 L300 195 M275 170 L325 170" stroke="${colorHex}" stroke-width="4" stroke-linecap="round"/>
                <text x="300" y="240" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" text-anchor="middle">${displayTitle}</text>
                <text x="300" y="275" font-family="monospace" font-size="16" fill="${colorHex}" text-anchor="middle">${displayTime}</text>
                <text x="300" y="315" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">點擊「更換照片」上傳實際施工照片</text>
            </svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
        }

        function getDefaultData() {
            return [
                { id: 1, date: '', time: '', stage: '', title: '', desc: '', position: 'top', color: 'blue', imgSrc: '' },
                { id: 2, date: '', time: '', stage: '', title: '', desc: '', position: 'bottom', color: 'blue', imgSrc: '' },
                { id: 3, date: '', time: '', stage: '', title: '', desc: '', position: 'top', color: 'amber', imgSrc: '' },
                { id: 4, date: '', time: '', stage: '', title: '', desc: '', position: 'bottom', color: 'amber', imgSrc: '' },
                { id: 5, date: '', time: '', stage: '', title: '', desc: '', position: 'top', color: 'indigo', imgSrc: '' },
                { id: 6, date: '', time: '', stage: '', title: '', desc: '', position: 'bottom', color: 'indigo', imgSrc: '' },
                { id: 7, date: '', time: '', stage: '', title: '', desc: '', position: 'top', color: 'emerald', imgSrc: '' },
                { id: 8, date: '', time: '', stage: '', title: '', desc: '', position: 'bottom', color: 'emerald', imgSrc: '' },
                { id: 9, date: '', time: '', stage: '', title: '', desc: '', position: 'top', color: 'rose', imgSrc: '' }
            ];
        }

        function formatDisplayTime(node) {
            if (!node.date && !node.time) return '--/-- --:--';
            let dateStr = '';
            if (node.date) {
                const parts = node.date.split('-');
                if (parts.length === 3) {
                    dateStr = `${parseInt(parts[1])}/${parseInt(parts[2])} `;
                } else {
                    dateStr = `${node.date} `;
                }
            }
            return `${dateStr}${node.time || ''}`.trim();
        }

        function sortNodesByDateTime(nodes) {
            return nodes.sort((a, b) => {
                if (!a.date && !a.time) return 1;
                if (!b.date && !b.time) return -1;
                const dtA = `${a.date || '1970-01-01'}T${a.time || '00:00'}`;
                const dtB = `${b.date || '1970-01-01'}T${b.time || '00:00'}`;
                return dtA.localeCompare(dtB);
            });
        }

        function loadNodesData() {
            const cacheKey = `fishbone_nodes_${currentMachineName}`;
            const saved = localStorage.getItem(cacheKey);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    return sortNodesByDateTime(parsed);
                } catch(e) {
                    console.error('快取解析失敗', e);
                }
            }
            return getDefaultData();
        }

        function saveNodesDataToCache() {
            nodesData = sortNodesByDateTime(nodesData);
            const cacheKey = `fishbone_nodes_${currentMachineName}`;
            localStorage.setItem(cacheKey, JSON.stringify(nodesData));
        }

        let nodesData = [];
        let imageCache = {};
        let cardHitBoxes = [];
        let uploadedImageBase64 = null;
        let currentModalNodeId = null;
        let pendingConfirmAction = null;

        window.onload = function() {
            const unitParam = getUnitParam();
            if (unitParam) {
                currentMachineName = unitParam;
                const fullTitle = `${unitParam}全套管施工進度與現場處置時間軸魚骨圖`;
                document.getElementById('header-title').innerText = fullTitle;
                document.getElementById('page-title').innerText = fullTitle;
            }

            nodesData = loadNodesData();
            initCanvas();
            renderManagementList();
        };

        function initCanvas() {
            const canvas = document.getElementById('fishboneCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const cardWidth = 240;
            const cardGap = 40;
            const startX = 140;
            const endX = 140;
            const totalWidth = Math.max(1600, startX + nodesData.length * (cardWidth + cardGap) + endX);
            const totalHeight = 720;

            const dpr = Math.max(2, window.devicePixelRatio || 1);

            canvas.width = totalWidth * dpr;
            canvas.height = totalHeight * dpr;
            canvas.style.width = totalWidth + 'px';
            canvas.style.height = totalHeight + 'px';

            ctx.resetTransform();
            ctx.scale(dpr, dpr);

            cardHitBoxes = [];

            drawFishboneCanvas(ctx, totalWidth, totalHeight);

            nodesData.forEach(node => {
                const timeStr = formatDisplayTime(node);
                const effectiveImgSrc = node.imgSrc || createSvgPlaceholder(node.title, timeStr, getColorHex(node.color));
                if (effectiveImgSrc) {
                    if (!imageCache[node.id] || imageCache[node.id].src !== effectiveImgSrc) {
                        const img = new Image();
                        img.crossOrigin = 'anonymous'; // 避免 Canvas 被標記污染
                        img.onload = function() {
                            imageCache[node.id] = img;
                            drawFishboneCanvas(ctx, totalWidth, totalHeight);
                        };
                        img.onerror = function() {
                            imageCache[node.id] = 'ERROR';
                            drawFishboneCanvas(ctx, totalWidth, totalHeight);
                        };
                        img.src = effectiveImgSrc;
                    }
                }
            });

            canvas.onclick = function(e) {
                const rect = canvas.getBoundingClientRect();
                const mouseX = (e.clientX - rect.left) * (totalWidth / rect.width);
                const mouseY = (e.clientY - rect.top) * (totalHeight / rect.height);

                for (let box of cardHitBoxes) {
                    if (mouseX >= box.x && mouseX <= box.x + box.w && mouseY >= box.y && mouseY <= box.y + box.h) {
                        openModal(box.id);
                        break;
                    }
                }
            };
        }

        function drawFishboneCanvas(ctx, w, h) {
            const fontStack = '-apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "Noto Sans TC", sans-serif';

            const bgGrad = ctx.createLinearGradient(0, 0, w, h);
            bgGrad.addColorStop(0, '#020617');
            bgGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, w, h);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < w; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }

            ctx.fillStyle = '#fbbf24';
            ctx.font = `bold 22px ${fontStack}`;
            const canvasMainTitle = `${currentMachineName}${currentMachineName.includes("全套管") ? "" : "全套管"}施工進度與現場處置時間軸魚骨圖`;
            ctx.fillText(canvasMainTitle, 40, 45);

            ctx.fillStyle = '#94a3b8';
            ctx.font = `13px ${fontStack}`;
            
            const validNodes = nodesData.filter(n => n.date || n.time);
            const startTimeStr = validNodes.length > 0 ? formatDisplayTime(validNodes[0]) : '--/-- --:--';
            const endTimeStr = validNodes.length > 0 ? formatDisplayTime(validNodes[validNodes.length - 1]) : '--/-- --:--';
            
            const titleWidth = ctx.measureText(canvasMainTitle).width;
            ctx.fillText(`時間區間：${startTimeStr} ~ ${endTimeStr} | 總節點數：${nodesData.length}`, 60 + titleWidth, 43);

            const spineY = h / 2;
            const startX = 80;
            const endX = w - 80;

            const spineGrad = ctx.createLinearGradient(startX, spineY, endX, spineY);
            spineGrad.addColorStop(0, '#38bdf8');
            spineGrad.addColorStop(0.5, '#f59e0b');
            spineGrad.addColorStop(1, '#f43f5e');

            ctx.strokeStyle = spineGrad;
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(startX, spineY);
            ctx.lineTo(endX, spineY);
            ctx.stroke();

            drawPillTag(ctx, startX - 45, spineY - 14, `START ${startTimeStr}`, '#0284c7');
            drawPillTag(ctx, endX - 35, spineY - 14, `END ${endTimeStr}`, '#e11d48');

            const cardW = 240;
            const cardH = 260;
            const cardGap = 40;
            const offsetX = 140;

            cardHitBoxes = [];

            nodesData.forEach((node, index) => {
                const isTop = node.position === 'top';
                const nodeX = offsetX + index * (cardW + cardGap);
                const colorHex = getColorHex(node.color);

                ctx.beginPath();
                ctx.arc(nodeX, spineY, 8, 0, Math.PI * 2);
                ctx.fillStyle = colorHex;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#020617';
                ctx.stroke();

                const cardY = isTop ? spineY - cardH - 50 : spineY + 50;

                ctx.strokeStyle = colorHex;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(nodeX, spineY);
                ctx.lineTo(nodeX, isTop ? cardY + cardH : cardY);
                ctx.stroke();

                cardHitBoxes.push({
                    id: node.id,
                    x: nodeX - cardW / 2,
                    y: cardY,
                    w: cardW,
                    h: cardH
                });

                drawNodeCard(ctx, nodeX - cardW / 2, cardY, cardW, cardH, node, colorHex, fontStack);
            });
        }

        function drawNodeCard(ctx, x, y, w, h, node, colorHex, fontStack) {
            ctx.save();
            drawRoundedRect(ctx, x, y, w, h, 12);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = colorHex;
            ctx.stroke();
            ctx.restore();

            const nodeTime = formatDisplayTime(node);
            const nodeStage = node.stage || '請選擇階段';
            const nodeTitle = node.title || '（點擊編輯標題）';
            const nodeDesc = node.desc || '請點擊編輯輸入內容...';

            ctx.fillStyle = colorHex;
            ctx.font = `bold 12px monospace, ${fontStack}`;
            ctx.fillText(nodeTime, x + 10, y + 22);

            ctx.fillStyle = node.stage ? '#f8fafc' : '#64748b';
            ctx.font = `bold 11px ${fontStack}`;
            ctx.fillText(truncateText(ctx, nodeStage, w - 110), x + 115, y + 22);

            const imgX = x + 10;
            const imgY = y + 32;
            const imgW = w - 20;
            const imgH = 110;

            ctx.save();
            drawRoundedRect(ctx, imgX, imgY, imgW, imgH, 8);
            ctx.clip();

            const cachedImg = imageCache[node.id];
            if (cachedImg && cachedImg instanceof HTMLImageElement && cachedImg.complete && cachedImg.naturalWidth > 0) {
                const hRatio = imgW / cachedImg.naturalWidth;
                const vRatio = imgH / cachedImg.naturalHeight;
                const ratio = Math.max(hRatio, vRatio);
                const centerShiftX = (imgW - cachedImg.naturalWidth * ratio) / 2;
                const centerShiftY = (imgH - cachedImg.naturalHeight * ratio) / 2;
                ctx.drawImage(cachedImg, 0, 0, cachedImg.naturalWidth, cachedImg.naturalHeight, imgX + centerShiftX, imgY + centerShiftY, cachedImg.naturalWidth * ratio, cachedImg.naturalHeight * ratio);
            } else {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(imgX, imgY, imgW, imgH);

                ctx.fillStyle = colorHex;
                ctx.globalAlpha = 0.2;
                ctx.beginPath();
                ctx.arc(imgX + imgW / 2, imgY + imgH / 2 - 8, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;

                ctx.fillStyle = colorHex;
                ctx.font = `bold 12px ${fontStack}`;
                ctx.textAlign = 'center';
                ctx.fillText('PHOTO', imgX + imgW / 2, imgY + imgH / 2 - 2);

                ctx.fillStyle = '#94a3b8';
                ctx.font = `10px ${fontStack}`;
                ctx.fillText('點擊可更換照片', imgX + imgW / 2, imgY + imgH / 2 + 18);
                ctx.textAlign = 'left';
            }
            ctx.restore();

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            drawRoundedRect(ctx, imgX, imgY, imgW, imgH, 8);
            ctx.stroke();

            ctx.fillStyle = node.title ? '#fbbf24' : '#64748b';
            ctx.font = `bold 13px ${fontStack}`;
            ctx.fillText(truncateText(ctx, nodeTitle, w - 24), x + 12, y + 164);

            ctx.fillStyle = node.desc ? '#cbd5e1' : '#475569';
            ctx.font = `11px ${fontStack}`;
            wrapText(ctx, nodeDesc, x + 12, y + 184, w - 24, 15, 4);
        }

        function drawRoundedRect(ctx, x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function drawPillTag(ctx, x, y, text, bgHex) {
            const fontStack = '-apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif';
            ctx.font = `bold 11px monospace, ${fontStack}`;
            const textWidth = ctx.measureText(text).width;
            const padX = 10;
            const h = 24;

            ctx.fillStyle = bgHex;
            drawRoundedRect(ctx, x, y, textWidth + padX * 2, h, 12);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, x + padX, y + 16);
        }

        function getColorHex(color) {
            switch(color) {
                case 'blue': return '#38bdf8';
                case 'rose': return '#f43f5e';
                case 'emerald': return '#34d399';
                case 'amber': return '#f59e0b';
                case 'indigo': return '#818cf8';
                default: return '#38bdf8';
            }
        }

        function truncateText(ctx, text, maxWidth) {
            if (!text) return '';
            const strText = String(text);
            if (ctx.measureText(strText).width <= maxWidth) return strText;
            let str = strText;
            while (str.length > 0 && ctx.measureText(str + '...').width > maxWidth) {
                str = str.slice(0, -1);
            }
            return str + '...';
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
            if (!text) return;
            const strText = String(text);
            const words = strText.split('');
            let line = '';
            let currentY = y;
            let linesCount = 1;

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n];
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, currentY);
                    line = words[n];
                    currentY += lineHeight;
                    linesCount++;
                    if (linesCount > maxLines) {
                        ctx.fillText(line + '...', x, currentY);
                        return;
                    }
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, currentY);
        }

        function renderManagementList() {
            const grid = document.getElementById('nodes-management-grid');
            if (!grid) return;
            grid.innerHTML = '';

            const badge = document.getElementById('node-count-badge');
            if (badge) badge.innerText = `共 ${nodesData.length} 個節點`;

            nodesData.forEach(node => {
                const colorHex = getColorHex(node.color);
                const card = document.createElement('div');
                card.className = "bg-slate-950 border border-slate-800 rounded-xl p-3.5 flex flex-col justify-between shadow hover:border-slate-700 transition";

                const timeDisplay = formatDisplayTime(node);
                const displayImg = node.imgSrc || createSvgPlaceholder(node.title, timeDisplay, colorHex);

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-mono font-bold px-2 py-0.5 rounded border" style="color: ${colorHex}; border-color: ${colorHex}40; background-color: ${colorHex}15;">
                                <i class="fa-solid fa-clock mr-1"></i>${timeDisplay}
                            </span>
                            <span class="text-[11px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded">${node.position === 'top' ? '上方骨節' : '下方骨節'}</span>
                        </div>
                        
                        <div class="flex gap-3 mb-2">
                            <img src="${displayImg}" onclick="openModal(${node.id})" class="w-20 h-20 object-cover rounded-lg border border-slate-800 cursor-pointer hover:opacity-80 transition flex-shrink-0">
                            <div class="overflow-hidden">
                                <span class="text-[10px] text-slate-400 block truncate">${node.stage || '請選擇施工階段'}</span>
                                <h4 class="text-sm font-bold text-amber-400 truncate mt-0.5">${node.title || '（點擊編輯標題）'}</h4>
                                <p class="text-xs text-slate-300 line-clamp-2 mt-1 leading-relaxed">${node.desc || '（點擊編輯說明）'}</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800/80">
                        <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded flex items-center gap-1 transition">
                            <i class="fa-solid fa-camera text-amber-400"></i> 上傳照片
                            <input type="file" accept="image/*" class="hidden" onchange="uploadDirectImageForNode(${node.id}, event)">
                        </label>
                        <button onclick="openEditModal(${node.id})" class="bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-slate-300 text-xs px-2.5 py-1 rounded flex items-center gap-1 transition border border-slate-700">
                            <i class="fa-solid fa-pen-to-square"></i> 編輯
                        </button>
                        <button onclick="deleteNode(${node.id})" class="bg-slate-800 hover:bg-rose-600 text-slate-400 hover:text-white text-xs px-2 py-1 rounded flex items-center gap-1 transition border border-slate-700">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function onStageChange(value) {
            const titleInput = document.getElementById('edit-title');
            if (!titleInput) return;
            if (value && (!titleInput.value || titleInput.value.trim() === '')) {
                titleInput.value = value;
            }
        }

        function previewUploadImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageBase64 = event.target.result;
                    document.getElementById('image-preview').src = uploadedImageBase64;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function uploadDirectImageForNode(id, e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64 = event.target.result;
                    const node = nodesData.find(n => n.id == id);
                    if (node) {
                        node.imgSrc = base64;
                        delete imageCache[node.id];
                        saveNodesDataToCache();
                        initCanvas();
                        renderManagementList();
                        if (currentModalNodeId == id) {
                            document.getElementById('modal-img').src = base64;
                        }
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function uploadDirectImageFromModal(e) {
            if (currentModalNodeId) {
                uploadDirectImageForNode(currentModalNodeId, e);
            }
        }

        function openEditModal(id) {
            uploadedImageBase64 = null;
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('edit-image-file').value = '';

            if (id) {
                const node = nodesData.find(n => n.id == id);
                if (!node) return;

                document.getElementById('modal-form-title').innerText = '編輯施工時間節點';
                document.getElementById('edit-id').value = node.id;
                document.getElementById('edit-date').value = node.date || '';
                document.getElementById('edit-time').value = node.time || '';
                document.getElementById('edit-stage').value = node.stage || '';
                document.getElementById('edit-title').value = node.title || '';
                document.getElementById('edit-desc').value = node.desc || '';
                document.getElementById('edit-position').value = node.position || 'top';
                document.getElementById('edit-color').value = node.color || 'emerald';

                if (node.imgSrc) {
                    document.getElementById('image-preview').src = node.imgSrc;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                }
            } else {
                document.getElementById('modal-form-title').innerText = '新增施工時間節點';
                document.getElementById('edit-id').value = '';
                document.getElementById('node-form').reset();
                document.getElementById('edit-date').value = '';
                document.getElementById('edit-time').value = '';
                document.getElementById('edit-position').value = nodesData.length % 2 === 0 ? 'top' : 'bottom';
                document.getElementById('edit-color').value = 'emerald';
            }

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function editFromModal() {
            const targetId = currentModalNodeId;
            closeModal();
            if (targetId) {
                openEditModal(targetId);
            }
        }

        function saveNode(e) {
            e.preventDefault();

            const id = document.getElementById('edit-id').value;
            const date = document.getElementById('edit-date').value || '';
            const time = document.getElementById('edit-time').value || '';
            const stage = document.getElementById('edit-stage').value || '';
            const title = document.getElementById('edit-title').value || '';
            const desc = document.getElementById('edit-desc').value || '';
            const position = document.getElementById('edit-position').value;
            const color = document.getElementById('edit-color').value;

            if (id) {
                const node = nodesData.find(n => n.id == id);
                if (node) {
                    node.date = date;
                    node.time = time;
                    node.stage = stage;
                    node.title = title;
                    node.desc = desc;
                    node.position = position;
                    node.color = color;
                    if (uploadedImageBase64) {
                        node.imgSrc = uploadedImageBase64;
                    }
                    delete imageCache[node.id];
                }
            } else {
                const newId = Date.now();
                nodesData.push({
                    id: newId,
                    date,
                    time,
                    stage,
                    title,
                    desc,
                    position,
                    color,
                    imgSrc: uploadedImageBase64 || ''
                });
            }

            saveNodesDataToCache();
            closeEditModal();
            initCanvas();
            renderManagementList();
        }

        function showConfirmDialog(title, message, onConfirm) {
            document.getElementById('confirm-modal-title').innerText = title;
            document.getElementById('confirm-modal-msg').innerText = message;
            pendingConfirmAction = onConfirm;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal(result) {
            document.getElementById('confirm-modal').classList.add('hidden');
            if (result && typeof pendingConfirmAction === 'function') {
                pendingConfirmAction();
            }
            pendingConfirmAction = null;
        }

        function deleteNode(id) {
            showConfirmDialog('刪除施工節點', '確定要刪除這個施工時間節點嗎？', function() {
                nodesData = nodesData.filter(n => n.id != id);
                delete imageCache[id];
                saveNodesDataToCache();
                initCanvas();
                renderManagementList();
            });
        }

        function openModal(id) {
            const node = nodesData.find(n => n.id == id);
            if (!node) return;

            currentModalNodeId = node.id;
            const timeDisplay = formatDisplayTime(node);
            document.getElementById('modal-time').innerText = timeDisplay;
            document.getElementById('modal-stage').innerText = node.stage || '請選擇階段';
            document.getElementById('modal-title').innerText = node.title || '（點擊編輯標題）';
            document.getElementById('modal-desc').innerText = node.desc || '請點擊編輯輸入說明文字...';
            document.getElementById('modal-img').src = node.imgSrc || createSvgPlaceholder(node.title, timeDisplay, getColorHex(node.color));
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeModal() {
            currentModalNodeId = null;
            document.getElementById('image-modal').classList.add('hidden');
        }

        function resetDefaultData() {
            showConfirmDialog('重置為空白版', '確定要重置並清空所有內容嗎？（您自行輸入的內容將會被重置）', function() {
                const cacheKey = `fishbone_nodes_${currentMachineName}`;
                localStorage.removeItem(cacheKey);
                nodesData = getDefaultData();
                imageCache = {};
                initCanvas();
                renderManagementList();
            });
        }

        // 🌟 強化版 匯出高畫質 PNG 圖片（具備跨域處理與容錯退場機制）
        function exportPNG() {
            const canvas = document.getElementById('fishboneCanvas');
            if (!canvas) return;

            try {
                // 1. 嘗試直接導出 DataURL 並下載
                const dataURL = canvas.toDataURL('image/png', 1.0);
                const link = document.createElement('a');
                link.download = `${currentMachineName}_施工進度魚骨圖_${new Date().toISOString().slice(0,10)}.png`;
                link.href = dataURL;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                console.warn('直接匯出失敗，啟動備用開圖機制：', err);
                
                // 2. 備用方案：如果 Canvas 被標記污染，自動在新分頁開啟全尺寸圖片供右鍵儲存
                try {
                    const win = window.open();
                    if (win) {
                        win.document.write(`<title>匯出魚骨圖</title><body style="margin:0;background:#020617;display:flex;justify-content:center;align-items:center;min-height:100vh;"><img src="${canvas.toDataURL()}" style="max-width:100%;height:auto;"/></body>`);
                    } else {
                        showConfirmDialog('提示', '圖片匯出被瀏覽器攔截，請允許開啟快彈出視窗。', null);
                    }
                } catch (e) {
                    showConfirmDialog('匯出失敗', '由於您上傳了跨網域的外部圖片，導致畫布受限。請先將照片更換為本地檔案後再試一次！', null);
                }
            }
        }

        // 列印 / 匯出 PDF
        function exportPDF() {
            const canvas = document.getElementById('fishboneCanvas');
            if (!canvas) return;

            try {
                const imgData = canvas.toDataURL('image/png', 1.0);
                const printWin = window.open('', '_blank');
                if (!printWin) {
                    showConfirmDialog('提示', '無法開啟列印視窗，請檢查瀏覽器是否攔截了彈出視窗。', null);
                    return;
                }

                printWin.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>${currentMachineName}工程施工進度魚骨圖</title>
                        <style>
                            @page { size: landscape; margin: 0; }
                            html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #020617; display: flex; align-items: center; justify-content: center; overflow: hidden; }
                            img { width: 100%; height: 100%; object-fit: contain; display: block; }
                        </style>
                    </head>
                    <body>
                        <img src="${imgData}" onload="window.print();">
                    </body>
                    </html>
                `);
                printWin.document.close();
            } catch(e) {
                showConfirmDialog('列印失敗', '請先將照片更換為本地上傳檔案後再進行列印。', null);
            }
        }
    </script>
</body>
</html>
