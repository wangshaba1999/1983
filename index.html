<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全套管工程管理系統入口</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col justify-between p-4 md:p-8">

    <!-- 頂部標題區 -->
    <header class="max-w-4xl mx-auto w-full text-center py-6 border-b border-slate-800">
        <div class="inline-flex items-center justify-center p-3 bg-amber-500/10 border border-amber-500/30 rounded-2xl mb-3 text-amber-400">
            <i class="fa-solid fa-helmet-safety text-3xl"></i>
        </div>
        <h1 class="text-2xl md:text-3xl font-bold text-slate-100 tracking-wide">全套管工程施工管理平台</h1>
        <p class="text-sm text-slate-400 mt-2">請選擇您要操作或填寫的工程報表工具</p>
    </header>

    <!-- 主選單卡片區 -->
    <main class="max-w-4xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-6 my-auto py-8">
        
        <!-- 選項 1：全套管施工管制表/日報表 -->
        <a href="daily_report.html" class="group bg-slate-900 border border-slate-800 hover:border-blue-500/50 rounded-2xl p-6 transition-all duration-300 hover:shadow-2xl hover:shadow-blue-500/10 flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center text-xl border border-blue-500/20 group-hover:bg-blue-500 group-hover:text-slate-950 transition-colors">
                        <i class="fa-solid fa-table-list"></i>
                    </div>
                    <span class="text-xs font-mono text-slate-500 bg-slate-950 px-2.5 py-1 rounded-full border border-slate-800">DAILY REPORT</span>
                </div>
                <h2 class="text-lg font-bold text-slate-100 group-hover:text-blue-400 transition-colors mb-2">
                    全套管施工管制表 (日報表)
                </h2>
                <p class="text-xs text-slate-400 leading-relaxed mb-4">
                    填寫每日施工階段作業時間、實際耗時紀錄與補充說明，支援一鍵匯出高畫質 PNG 圖片或 A4 橫式 PDF 檔案。
                </p>
            </div>
            <div class="flex items-center text-xs font-bold text-blue-400 group-hover:translate-x-1 transition-transform">
                開啟報表填寫 <i class="fa-solid fa-arrow-right ml-2"></i>
            </div>
        </a>

        <!-- 選項 2：工程施工進度魚骨圖 -->
        <a href="fishbone.html" class="group bg-slate-900 border border-slate-800 hover:border-amber-500/50 rounded-2xl p-6 transition-all duration-300 hover:shadow-2xl hover:shadow-amber-500/10 flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between mb-4">
                    <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-xl flex items-center justify-center text-xl border border-amber-500/20 group-hover:bg-amber-500 group-hover:text-slate-950 transition-colors">
                        <i class="fa-solid fa-fish-fins"></i>
                    </div>
                    <span class="text-xs font-mono text-slate-500 bg-slate-950 px-2.5 py-1 rounded-full border border-slate-800">FISHBONE CHART</span>
                </div>
                <h2 class="text-lg font-bold text-slate-100 group-hover:text-amber-400 transition-colors mb-2">
                    施工進度與處置魚骨圖
                </h2>
                <p class="text-xs text-slate-400 leading-relaxed mb-4">
                    可視覺化排定施工時間軸、新增時間節點、上傳現場照片，自動排列呈現橫向魚骨圖，並提供 PNG/PDF 匯出。
                </p>
            </div>
            <div class="flex items-center text-xs font-bold text-amber-400 group-hover:translate-x-1 transition-transform">
                開啟魚骨圖編輯 <i class="fa-solid fa-arrow-right ml-2"></i>
            </div>
        </a>

    </main>

    <!-- 頁尾資訊 -->
    <footer class="max-w-4xl mx-auto w-full text-center py-4 border-t border-slate-800/80 text-xs text-slate-500">
        全套管工程施工管理平台 &copy; 2026
    </footer>

</body>
</html>
