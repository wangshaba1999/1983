<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工程施工管理平台</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #020617;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .machine-card, .unit-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .machine-card:active, .unit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950 p-4 md:p-6">

    <!-- 頂部標題區 -->
    <header class="max-w-2xl mx-auto w-full text-center py-4 border-b border-slate-800/80">
        <div class="inline-flex items-center justify-center p-3 bg-amber-500/10 border border-amber-500/30 rounded-2xl mb-2 text-amber-400 shadow-lg shadow-amber-500/5">
            <i class="fa-solid fa-helmet-safety text-2xl md:text-3xl"></i>
        </div>
        <h1 class="text-xl md:text-2xl font-black text-slate-100 tracking-wide">工程施工管理平台</h1>
        <p class="text-xs text-slate-400 mt-1">請選擇您要操作的施工回報工具</p>
    </header>

    <!-- 主要區域 -->
    <main class="max-w-2xl mx-auto w-full my-auto py-6 space-y-8">

        <!-- 區塊一：通用獨立功能（免選機組，隨點即用） -->
        <section>
            <div class="flex items-center justify-between mb-3 px-1">
                <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-camera-retro"></i> 每日通用回報工具
                </span>
                <span class="text-[11px] text-slate-500">獨立功能 / 免選機組</span>
            </div>

            <!-- 收工每日施工照片連結 (dailypic6.html) -->
            <a href="dailypic6.html" class="group bg-slate-900 border border-slate-800 hover:border-emerald-500/50 rounded-2xl p-4 flex items-center justify-between transition-all shadow-lg block">
                <div class="flex items-center gap-3.5">
                    <div class="w-11 h-11 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center text-xl border border-emerald-500/20 group-hover:bg-emerald-500 group-hover:text-slate-950 transition-colors shrink-0">
                        <i class="fa-solid fa-images"></i>
                    </div>
                    <div>
                        <h2 class="text-sm font-bold text-slate-100 group-hover:text-emerald-400 transition-colors">
                            收工每日施工照片回報 (6宮格)
                        </h2>
                        <p class="text-[11px] text-slate-400 mt-0.5">全工地每日收工 6 張施工現況照片上傳、文字編輯與輸出</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-600 group-hover:text-emerald-400 group-hover:translate-x-1 transition-all text-sm ml-2"></i>
            </a>
        </section>

        <!-- 分隔線 -->
        <hr class="border-slate-800/80">

        <!-- 區塊二：全套管機組專屬區（必須依序選擇） -->
        <section class="space-y-6">

            <!-- 步驟 1：選擇全套管機組 (#1 ~ #5) -->
            <div id="step-machine">
                <div class="flex items-center justify-between mb-3 px-1">
                    <span class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-screwdriver-wrench"></i> 全套管管制區 - STEP 1. 選擇施工機組
                    </span>
                    <span class="text-[11px] text-slate-500">共 5 台鑽掘機</span>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <!-- 1號機 -->
                    <button onclick="selectMachine('1號機', 'blue', this)" class="machine-btn machine-card bg-slate-900/90 border-2 border-slate-800 hover:border-blue-500 rounded-2xl p-3.5 flex flex-col items-center justify-center gap-1.5 relative overflow-hidden group">
                        <div class="w-9 h-9 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center text-base font-black group-hover:bg-blue-500 group-hover:text-slate-950 transition-colors">
                            #1
                        </div>
                        <span class="text-sm font-bold text-slate-100">1號機</span>
                    </button>

                    <!-- 2號機 -->
                    <button onclick="selectMachine('2號機', 'emerald', this)" class="machine-btn machine-card bg-slate-900/90 border-2 border-slate-800 hover:border-emerald-500 rounded-2xl p-3.5 flex flex-col items-center justify-center gap-1.5 relative overflow-hidden group">
                        <div class="w-9 h-9 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center text-base font-black group-hover:bg-emerald-500 group-hover:text-slate-950 transition-colors">
                            #2
                        </div>
                        <span class="text-sm font-bold text-slate-100">2號機</span>
                    </button>

                    <!-- 3號機 -->
                    <button onclick="selectMachine('3號機', 'amber', this)" class="machine-btn machine-card bg-slate-900/90 border-2 border-slate-800 hover:border-amber-500 rounded-2xl p-3.5 flex flex-col items-center justify-center gap-1.5 relative overflow-hidden group">
                        <div class="w-9 h-9 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center justify-center text-base font-black group-hover:bg-amber-500 group-hover:text-slate-950 transition-colors">
                            #3
                        </div>
                        <span class="text-sm font-bold text-slate-100">3號機</span>
                    </button>

                    <!-- 4號機 -->
                    <button onclick="selectMachine('4號機', 'rose', this)" class="machine-btn machine-card bg-slate-900/90 border-2 border-slate-800 hover:border-rose-500 rounded-2xl p-3.5 flex flex-col items-center justify-center gap-1.5 relative overflow-hidden group">
                        <div class="w-9 h-9 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/20 flex items-center justify-center text-base font-black group-hover:bg-rose-500 group-hover:text-slate-950 transition-colors">
                            #4
                        </div>
                        <span class="text-sm font-bold text-slate-100">4號機</span>
                    </button>

                    <!-- 5號機 (新增) -->
                    <button onclick="selectMachine('5號機', 'purple', this)" class="machine-btn machine-card bg-slate-900/90 border-2 border-slate-800 hover:border-purple-500 rounded-2xl p-3.5 flex flex-col items-center justify-center gap-1.5 relative overflow-hidden group col-span-2 sm:col-span-1">
                        <div class="w-9 h-9 rounded-xl bg-purple-500/10 text-purple-400 border border-purple-500/20 flex items-center justify-center text-base font-black group-hover:bg-purple-500 group-hover:text-slate-950 transition-colors">
                            #5
                        </div>
                        <span class="text-sm font-bold text-slate-100">5號機</span>
                    </button>
                </div>
            </div>

            <!-- 步驟 2：選擇 Unit 與樁號 (選完機組後解鎖) -->
            <div id="step-location" class="space-y-4 opacity-50 pointer-events-none transition-all duration-300 bg-slate-900/50 border border-slate-800/80 rounded-2xl p-4">
                <div class="flex items-center justify-between px-1">
                    <span class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-map-pin"></i> STEP 2. 選擇施工區域與樁號
                    </span>
                    <span id="selected-machine-badge" class="text-xs font-bold text-slate-300 bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700">
                        未選擇機組
                    </span>
                </div>

                <!-- Unit 按鈕選擇 -->
                <div>
                    <label class="block text-[11px] text-slate-400 mb-2 font-medium">選擇 Unit 區塊：</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="selectUnit('Unit 1', this)" class="unit-btn bg-slate-900 border-2 border-slate-800 hover:border-amber-500 py-3 px-4 rounded-xl text-sm font-bold text-slate-300 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-layer-group text-slate-500 unit-icon"></i> Unit 1
                        </button>
                        <button type="button" onclick="selectUnit('Unit 2', this)" class="unit-btn bg-slate-900 border-2 border-slate-800 hover:border-amber-500 py-3 px-4 rounded-xl text-sm font-bold text-slate-300 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-layer-group text-slate-500 unit-icon"></i> Unit 2
                        </button>
                    </div>
                </div>

                <!-- 下拉式選單從 A001 ~ A206 -->
                <div>
                    <label for="pile-select" class="block text-[11px] text-slate-400 mb-2 font-medium">選擇樁號 (A001 ~ A206)：</label>
                    <div class="relative">
                        <select id="pile-select" onchange="updatePileSelection()" class="w-full bg-slate-900 border-2 border-slate-800 focus:border-amber-500 text-slate-100 text-sm rounded-xl py-3 px-4 appearance-none outline-none transition-colors">
                            <option value="" disabled selected>-- 請選擇樁號代碼 --</option>
                            <!-- 動態產生 A001 至 A206 -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 步驟 3：選擇全套管報表工具 (選完 Unit 與樁號後解鎖) -->
            <div id="step-tool" class="space-y-3 opacity-50 pointer-events-none transition-all duration-300">
                <div class="flex items-center justify-between px-1">
                    <span class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-circle-dot"></i> STEP 3. 進入全套管報表與工具
                    </span>
                    <span id="selected-location-badge" class="text-xs font-bold text-slate-400">
                        尚未完整選擇樁號
                    </span>
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <!-- 全套管施工管制表 (日報表) -->
                    <a id="btn-daily-report" href="#" onclick="checkReady(event)" class="group bg-slate-900 border border-slate-800 hover:border-blue-500/50 rounded-2xl p-4 flex items-center justify-between transition-all shadow-lg">
                        <div class="flex items-center gap-3.5">
                            <div class="w-11 h-11 bg-blue-500/10 text-blue-400 rounded-xl flex items-center justify-center text-xl border border-blue-500/20 group-hover:bg-blue-500 group-hover:text-slate-950 transition-colors shrink-0">
                                <i class="fa-solid fa-table-list"></i>
                            </div>
                            <div>
                                <h2 class="text-sm font-bold text-slate-100 group-hover:text-blue-400 transition-colors">
                                    全套管施工管制表 (日報表)
                                </h2>
                                <p class="text-[11px] text-slate-400 mt-0.5">每日工項時間、查驗點、耗時統計與列印/匯出</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-600 group-hover:text-blue-400 group-hover:translate-x-1 transition-all text-sm ml-2"></i>
                    </a>

                    <!-- 全套管魚骨圖 -->
                    <a id="btn-fishbone" href="#" onclick="checkReady(event)" class="group bg-slate-900 border border-slate-800 hover:border-amber-500/50 rounded-2xl p-4 flex items-center justify-between transition-all shadow-lg">
                        <div class="flex items-center gap-3.5">
                            <div class="w-11 h-11 bg-amber-500/10 text-amber-400 rounded-xl flex items-center justify-center text-xl border border-amber-500/20 group-hover:bg-amber-500 group-hover:text-slate-950 transition-colors shrink-0">
                                <i class="fa-solid fa-fish-fins"></i>
                            </div>
                            <div>
                                <h2 class="text-sm font-bold text-slate-100 group-hover:text-amber-400 transition-colors">
                                    全套管施工進度魚骨圖
                                </h2>
                                <p class="text-[11px] text-slate-400 mt-0.5">時間軸魚骨圖、現場施工照片上傳與節點紀錄</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-slate-600 group-hover:text-amber-400 group-hover:translate-x-1 transition-all text-sm ml-2"></i>
                    </a>
                </div>
            </div>

        </section>

    </main>

    <!-- 頁尾 -->
    <footer class="max-w-2xl mx-auto w-full text-center py-3 border-t border-slate-800/80 text-[11px] text-slate-500">
        工程施工管理平台 &copy; 2026
    </footer>

    <!-- JavaScript 邏輯腳本 -->
    <script>
        let currentSelectedUnit = null;
        let currentSelectedMachine = null;
        let currentSelectedPile = null;

        // 初始化自動產生 A001 ~ A206 下拉選單
        window.addEventListener('DOMContentLoaded', () => {
            const selectElem = document.getElementById('pile-select');
            for (let i = 1; i <= 206; i++) {
                // 將數字補齊為三位數，例如 1 變成 A001, 42 變成 A042
                const pileNum = 'A' + String(i).padStart(3, '0');
                const option = document.createElement('option');
                option.value = pileNum;
                option.textContent = pileNum;
                selectElem.appendChild(option);
            }
        });

        // 1. 選擇機組邏輯
        function selectMachine(unitName, themeColor, btnElem) {
            currentSelectedMachine = unitName;

            // 清除所有機組卡片的選取與發光狀態
            document.querySelectorAll('.machine-btn').forEach(btn => {
                btn.classList.remove(
                    'border-blue-500', 'border-emerald-500', 'border-amber-500', 'border-rose-500', 'border-purple-500',
                    'ring-blue-500/30', 'ring-emerald-500/30', 'ring-amber-500/30', 'ring-rose-500/30', 'ring-purple-500/30',
                    'bg-slate-800', 'ring-2'
                );
                btn.classList.add('border-slate-800', 'bg-slate-900/90');
            });

            // 標記當前選中的機組卡片樣式
            btnElem.classList.remove('border-slate-800', 'bg-slate-900/90');
            btnElem.classList.add('bg-slate-800', 'ring-2');

            const badge = document.getElementById('selected-machine-badge');
            badge.innerText = `已選：${unitName}`;

            // 根據顏色設置固定的 Tailwind 類別
            if (themeColor === 'blue') {
                btnElem.classList.add('border-blue-500', 'ring-blue-500/30');
                badge.className = 'text-xs font-bold px-2.5 py-1 rounded-lg border text-blue-400 bg-blue-500/10 border-blue-500/30';
            } else if (themeColor === 'emerald') {
                btnElem.classList.add('border-emerald-500', 'ring-emerald-500/30');
                badge.className = 'text-xs font-bold px-2.5 py-1 rounded-lg border text-emerald-400 bg-emerald-500/10 border-emerald-500/30';
            } else if (themeColor === 'amber') {
                btnElem.classList.add('border-amber-500', 'ring-amber-500/30');
                badge.className = 'text-xs font-bold px-2.5 py-1 rounded-lg border text-amber-400 bg-amber-500/10 border-amber-500/30';
            } else if (themeColor === 'rose') {
                btnElem.classList.add('border-rose-500', 'ring-rose-500/30');
                badge.className = 'text-xs font-bold px-2.5 py-1 rounded-lg border text-rose-400 bg-rose-500/10 border-rose-500/30';
            } else if (themeColor === 'purple') {
                btnElem.classList.add('border-purple-500', 'ring-purple-500/30');
                badge.className = 'text-xs font-bold px-2.5 py-1 rounded-lg border text-purple-400 bg-purple-500/10 border-purple-500/30';
            }

            // 解鎖 STEP 2 區域
            const stepLocation = document.getElementById('step-location');
            stepLocation.classList.remove('opacity-50', 'pointer-events-none');
            stepLocation.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            updateLinks();
        }

        // 2. 選擇 Unit 邏輯
        function selectUnit(unitName, btnElem) {
            currentSelectedUnit = unitName;

            // 清除 Unit 按鈕樣式
            document.querySelectorAll('.unit-btn').forEach(btn => {
                btn.classList.remove('border-amber-500', 'bg-amber-500/10', 'text-amber-400', 'ring-2', 'ring-amber-500/30');
                btn.classList.add('border-slate-800', 'bg-slate-900', 'text-slate-300');
                const icon = btn.querySelector('.unit-icon');
                if(icon) icon.classList.add('text-slate-500');
                if(icon) icon.classList.remove('text-amber-400');
            });

            // 加上選取樣式
            btnElem.classList.remove('border-slate-800', 'bg-slate-900', 'text-slate-300');
            btnElem.classList.add('border-amber-500', 'bg-amber-500/10', 'text-amber-400', 'ring-2', 'ring-amber-500/30');
            const icon = btnElem.querySelector('.unit-icon');
            if(icon) {
                icon.classList.remove('text-slate-500');
                icon.classList.add('text-amber-400');
            }

            checkAndUnlockTool();
        }

        // 3. 選擇樁號下拉選單邏輯
        function updatePileSelection() {
            const selectElem = document.getElementById('pile-select');
            currentSelectedPile = selectElem.value;
            checkAndUnlockTool();
        }

        // 檢查是否 Unit 與樁號皆已選擇，若皆已選擇則解鎖 STEP 3 報表工具
        function checkAndUnlockTool() {
            const stepTool = document.getElementById('step-tool');
            const locationBadge = document.getElementById('selected-location-badge');

            if (currentSelectedUnit && currentSelectedPile) {
                stepTool.classList.remove('opacity-50', 'pointer-events-none');
                locationBadge.innerText = `已指定：${currentSelectedUnit}-${currentSelectedPile}`;
                locationBadge.className = 'text-xs font-bold text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/30';
                
                updateLinks();
                stepTool.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                stepTool.classList.add('opacity-50', 'pointer-events-none');
                locationBadge.innerText = '尚未完整選擇 Unit 與樁號';
                locationBadge.className = 'text-xs font-bold text-slate-400';
            }
        }

        // 更新傳遞參數連結 (例如: daily_report.html?unit=2號機&location=UNIT2-A042)
        function updateLinks() {
            if (currentSelectedMachine && currentSelectedUnit && currentSelectedPile) {
                const fullLocation = `${currentSelectedUnit}-${currentSelectedPile}`;
                const queryParams = `?unit=${encodeURIComponent(currentSelectedMachine)}&pile=${encodeURIComponent(fullLocation)}`;
                
                document.getElementById('btn-daily-report').href = `daily_report.html${queryParams}`;
                document.getElementById('btn-fishbone').href = `fishbone.html${queryParams}`;
            }
        }

        // 檢查防呆提示
        function checkReady(e) {
            if (!currentSelectedMachine) {
                e.preventDefault();
                alert('請先在 STEP 1 點選施工機組！');
                return;
            }
            if (!currentSelectedUnit || !currentSelectedPile) {
                e.preventDefault();
                alert('請先在 STEP 2 完成 Unit 選擇與樁號下拉選單！');
            }
        }
    </script>
</body>
</html>
