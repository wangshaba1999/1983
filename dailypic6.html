<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大林計畫施工照片回報網頁工具</title>
    <!-- html2canvas and jspdf CDN for exporting image and PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", Arial, sans-serif;
        }
        body {
            background-color: #eef2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Control Panel */
        .controls {
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            max-width: 1000px;
            width: 100%;
        }

        .btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:hover {
            background-color: #003d82;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-green {
            background-color: #28a745;
        }
        .btn-green:hover {
            background-color: #1e7e34;
        }

        /* Slide Container */
        .slide-container {
            width: 1000px;
            height: 562.5px;
            background-color: white;
            padding: 10px 18px 8px 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            background: #ffffff;
            overflow: hidden;
        }

        /* Header Area */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 4px;
            width: 100%;
            height: 42px;
        }

        .title {
            font-size: 25px;
            font-weight: bold;
            color: #0056b3; /* 藍色標題字體 */
            text-align: center;
            width: 100%;
            outline: none;
            padding: 0;
            line-height: 1.3;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 6-Photo Grid */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 0px;
            flex-grow: 1;
            height: 472px;
            margin-bottom: 2px;
        }

        .photo-card {
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            border: 1px solid #333333;
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        /* 消除負邊距重疊 */
        .photo-grid .photo-card:nth-child(n+4) {
            margin-top: -1px;
        }
        .photo-grid .photo-card:nth-child(3n+2),
        .photo-grid .photo-card:nth-child(3n+3) {
            margin-left: -1px;
        }

        /* Photo Box */
        .photo-box {
            flex: 1;
            position: relative;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            width: 100%;
            height: 182px;
            padding: 4px;
            border-bottom: 1px solid #333333;
        }

        .photo-box img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .upload-hint {
            position: absolute;
            color: #6c757d;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }

        .file-input {
            display: none;
        }

        /* Captions under photos */
        .caption-area {
            background: #ffffff;
            padding: 2px 4px;
            display: flex;
            flex-direction: column;
            gap: 0px;
            height: 48px;
            justify-content: center;
            align-items: center;
        }

        .caption-line {
            font-size: 13.5px;
            font-weight: 600;
            color: #111111;
            outline: none;
            width: 100%;
            text-align: center;
            line-height: 1.2;
            height: 21px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
            border: none;
            background: transparent;
        }

        /* Footer Area - Updated text color to match title (#0056b3) */
        .footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 28px;
            padding-top: 2px;
        }

        .footer-text {
            font-size: 14px;
            color: #0056b3; /* 調整為跟標題相同的藍色 */
            font-weight: bold;
            text-align: right;
            outline: none;
            width: 250px;
            background: transparent;
            line-height: 1.3;
            height: 26px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        /* Printable setup */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .controls {
                display: none;
            }
            .slide-container {
                box-shadow: none;
                width: 100vw;
                height: 100vh;
                page-break-after: always;
            }
            .upload-hint {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Top Controls -->
    <div class="controls">
        <span style="font-weight: bold; color: #333;">📷 點擊照片框上傳照片 | 點擊文字可直接修改</span>
        <button class="btn" onclick="exportToImage()">🖼️ 輸出為照片 (PNG)</button>
        <button class="btn btn-green" onclick="exportToPDF()">📄 輸出為 PDF</button>
    </div>

    <!-- Main PPT Slide Canvas -->
    <div class="slide-container" id="capture-target">
        <!-- Title Header -->
        <div class="header">
            <div class="title" contenteditable="true" spellcheck="false">大林計畫ME01土建施工現況照片(1/1)</div>
        </div>

        <!-- 6 Grid Photos -->
        <div class="photo-grid">
            <!-- Box 1 -->
            <div class="photo-card">
                <div class="photo-box" onclick="triggerFileInput(1)">
                    <span class="upload-hint" id="hint-1">點擊選擇照片</span>
                    <img id="img-1" src="" style="display:none;">
                </div>
                <input type="file" id="file-1" class="file-input" accept="image/*" onchange="previewImage(event, 1)">
                <div class="caption-area">
                    <div class="caption-line" contenteditable="true" spellcheck="false">全套管#2機</div>
                    <div class="caption-line" contenteditable="true" spellcheck="false">Unit2 pedestal鋼筋籠吊裝</div>
                </div>
            </div>

            <!-- Box 2 -->
            <div class="photo-card">
                <div class="photo-box" onclick="triggerFileInput(2)">
                    <span class="upload-hint" id="hint-2">點擊選擇照片</span>
                    <img id="img-2" src="" style="display:none;">
                </div>
                <input type="file" id="file-2" class="file-input" accept="image/*" onchange="previewImage(event, 2)">
                <div class="caption-area">
                    <div class="caption-line" contenteditable="true" spellcheck="false">拆除整地作業</div>
                    <div class="caption-line" contenteditable="true" spellcheck="false">第5區破碎物咬碎作業</div>
                </div>
            </div>

            <!-- Box 3 -->
            <div class="photo-card">
                <div class="photo-box" onclick="triggerFileInput(3)">
                    <span class="upload-hint" id="hint-3">點擊選擇照片</span>
                    <img id="img-3" src="" style="display:none;">
                </div>
                <input type="file" id="file-3" class="file-input" accept="image/*" onchange="previewImage(event, 3)">
                <div class="caption-area">
                    <div class="caption-line" contenteditable="true" spellcheck="false">PBA區#7砂樁機</div>
                    <div class="caption-line" contenteditable="true" spellcheck="false">第10區砂樁打設</div>
                </div>
            </div>

            <!-- Box 4 -->
            <div class="photo-card">
                <div class="photo-box" onclick="triggerFileInput(4)">
                    <span class="upload-hint" id="hint-4">點擊選擇照片</span>
                    <img id="img-4" src="" style="display:none;">
                </div>
                <input type="file" id="file-4" class="file-input" accept="image/*" onchange="previewImage(event, 4)">
                <div class="caption-area">
                    <div class="caption-line" contenteditable="true" spellcheck="false">OBA區_#3機</div>
                    <div class="caption-line" contenteditable="true" spellcheck="false">第15區砂樁打設</div>
                </div>
            </div>

            <!-- Box 5 -->
            <div class="photo-card">
                <div class="photo-box" onclick="triggerFileInput(5)">
                    <span class="upload-hint" id="hint-5">點擊選擇照片</span>
                    <img id="img-5" src="" style="display:none;">
                </div>
                <input type="file" id="file-5" class="file-input" accept="image/*" onchange="previewImage(event, 5)">
                <div class="caption-area">
                    <div class="caption-line" contenteditable="true" spellcheck="false">PBA區#1砂樁機</div>
                    <div class="caption-line" contenteditable="true" spellcheck="false">第8區砂樁打設</div>
                </div>
            </div>

            <!-- Box 6 -->
            <div class="photo-card">
                <div class="photo-box" onclick="triggerFileInput(6)">
                    <span class="upload-hint" id="hint-6">點擊選擇照片</span>
                    <img id="img-6" src="" style="display:none;">
                </div>
                <input type="file" id="file-6" class="file-input" accept="image/*" onchange="previewImage(event, 6)">
                <div class="caption-area">
                    <div class="caption-line" contenteditable="true" spellcheck="false">PBA區#4砂樁機</div>
                    <div class="caption-line" contenteditable="true" spellcheck="false">第6區砂樁打設</div>
                </div>
            </div>
        </div>

        <!-- Footer Area -->
        <div class="footer">
            <div class="footer-text" id="footer-date" contenteditable="true" spellcheck="false"></div>
        </div>
    </div>

    <script>
        // Set dynamic ROC date on page load
        function setROCDate() {
            const today = new Date();
            const yearROC = today.getFullYear() - 1911;
            const month = today.getMonth() + 1;
            const day = today.getDate();
            const dateStr = `更新日期:${yearROC}年${month}月${day}日`;
            document.getElementById('footer-date').innerText = dateStr;
        }

        window.onload = setROCDate;

        function triggerFileInput(index) {
            document.getElementById(`file-${index}`).click();
        }

        function previewImage(event, index) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById(`img-${index}`);
                    const hint = document.getElementById(`hint-${index}`);
                    img.src = e.target.result;
                    img.style.display = 'block';
                    if (hint) hint.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        // Export as PNG Image
        async function exportToImage() {
            const target = document.getElementById('capture-target');
            
            // Hide upload hints
            const hints = document.querySelectorAll('.upload-hint');
            hints.forEach(h => h.style.visibility = 'hidden');

            const canvas = await html2canvas(target, {
                scale: 2,
                useCORS: true
            });

            hints.forEach(h => h.style.visibility = 'visible');

            const link = document.createElement('a');
            link.download = '施工照片回報.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Export as PDF
        async function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const target = document.getElementById('capture-target');

            const hints = document.querySelectorAll('.upload-hint');
            hints.forEach(h => h.style.visibility = 'hidden');

            const canvas = await html2canvas(target, {
                scale: 2,
                useCORS: true
            });

            hints.forEach(h => h.style.visibility = 'visible');

            const imgData = canvas.toDataURL('image/jpeg', 0.95);
            
            // Landscape A4 size: 297mm x 210mm
            const pdf = new jsPDF('landscape', 'mm', 'a4');
            pdf.addImage(imgData, 'JPEG', 0, 0, 297, 210);
            pdf.save('施工照片回報.pdf');
        }
    </script>
</body>
</html>
